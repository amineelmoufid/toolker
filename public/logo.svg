<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Brutalist Hard Shadow -->
  <rect x="20" y="20" width="84" height="84" rx="6" fill="#1c1d20" />
  
  <!-- Main Base -->
  <rect x="12" y="12" width="84" height="84" rx="6" fill="#e4dfd3" stroke="#1c1d20" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Rivets / Screws -->
  <path d="M 22 22 L 26 22 M 24 20 L 24 24" stroke="#7a776e" stroke-width="1.5" />
  <path d="M 82 22 L 86 22 M 84 20 L 84 24" stroke="#7a776e" stroke-width="1.5" />
  <path d="M 22 82 L 26 82 M 24 80 L 24 84" stroke="#7a776e" stroke-width="1.5" />
  <path d="M 82 82 L 86 82 M 84 80 L 84 84" stroke="#7a776e" stroke-width="1.5" />

  <!-- The "T" Logo Mark -->
  <!-- Top Bar of T (Orange) -->
  <rect x="32" y="32" width="44" height="16" fill="#cf573c" stroke="#1c1d20" stroke-width="3" stroke-linejoin="round" />
  <!-- Stem of T (Blue-Gray) -->
  <rect x="46" y="48" width="16" height="32" fill="#476171" stroke="#1c1d20" stroke-width="3" stroke-linejoin="round" />
  
  <!-- Accent Recording Dot (Green) -->
  <circle cx="76" cy="76" r="5" fill="#3d7a4d" stroke="#1c1d20" stroke-width="2" />
</svg>
