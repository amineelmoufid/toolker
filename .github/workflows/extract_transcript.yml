name: Cloud YouTube Transcript Extractor

on:
  repository_dispatch:
    types: [extract-transcript]
  workflow_dispatch:
    inputs:
      videoId:
        description: 'YouTube Video ID'
        required: true
        type: string
      lang:
        description: 'Preferred Language (optional)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  extract:
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract Transcript
        shell: pwsh
        run: |
          $videoId = "${{ github.event.client_payload.videoId || github.event.inputs.videoId }}"
          $lang = "${{ github.event.client_payload.lang || github.event.inputs.lang }}"
          Write-Host "Running residential extraction for videoId: $videoId (lang: $lang)"
          py scripts/extract_transcript.py "$videoId" "$lang"

      - name: Commit and Push Transcript
        shell: pwsh
        run: |
          $videoId = "${{ github.event.client_payload.videoId || github.event.inputs.videoId }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/transcripts/
          git commit -m "Auto-cache transcript for YouTube video $videoId"
          git push origin main
