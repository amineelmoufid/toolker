name: Cloud YouTube Transcript Extractor

on:
  repository_dispatch:
    types: [extract-transcript]
  workflow_dispatch:
    inputs:
      videoId:
        description: 'YouTube Video ID'
        required: true
        type: string
      lang:
        description: 'Preferred Language (optional)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install youtube-transcript-api yt-dlp

      - name: Extract Transcript
        run: |
          VIDEO_ID="${{ github.event.client_payload.videoId || github.event.inputs.videoId }}"
          LANG="${{ github.event.client_payload.lang || github.event.inputs.lang }}"
          echo "Running cloud extraction for videoId: $VIDEO_ID (lang: $LANG)"
          python scripts/extract_transcript.py "$VIDEO_ID" "$LANG"

      - name: Commit and Push Transcript
        run: |
          VIDEO_ID="${{ github.event.client_payload.videoId || github.event.inputs.videoId }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/transcripts/
          if ! git diff --cached --quiet; then
            git commit -m "Auto-cache transcript for YouTube video $VIDEO_ID"
            git pull origin main --rebase -X ours
            git push origin main
          else
            echo "No new transcript changes to commit."
          fi
